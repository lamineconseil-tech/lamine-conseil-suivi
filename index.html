<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi des contrats de domiciliation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  :root{
    --navy:#1c2b44;
    --navy-dark:#12192b;
    --paper:#fbf9f3;
    --gold:#a9824c;
    --ink:#232323;
    --muted:#6b6f76;
    --warn:#b8863b;
    --warn-bg:#fbf1de;
    --danger:#a13d3d;
    --danger-bg:#f8e9e7;
    --ok:#3f7a52;
    --ok-bg:#e9f2ea;
    --border:#ddd6c8;
    --line:#e4e1d8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#f2efe8;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:980px;margin:0 auto;padding:0 0 48px;}
  header.top{
    background:var(--navy);
    color:#f2efe8;
    padding:22px 24px 18px;
    border-bottom:3px solid var(--gold);
  }
  header.top h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.2px;}
  header.top p{margin:4px 0 0;font-size:13px;color:#c7cede;}
  nav.tabs{
    display:flex;
    gap:2px;
    background:var(--navy-dark);
    padding:0 24px;
  }
  nav.tabs button{
    appearance:none;border:none;background:transparent;color:#9aa4bd;
    padding:12px 16px;font-size:13.5px;font-weight:500;cursor:pointer;
    border-bottom:2px solid transparent;
  }
  nav.tabs button.active{color:#fff;border-bottom-color:var(--gold);}
  main{padding:22px 20px 0;}
  @media (min-width:640px){ main{padding:26px 24px 0;} }

  .card{
    background:#fff;border:1px solid var(--border);border-radius:6px;
    padding:18px 18px 20px;margin-bottom:18px;
  }
  .card h2{margin:0 0 4px;font-size:15px;color:var(--navy);}
  .card .sub{margin:0 0 16px;font-size:12.5px;color:var(--muted);}

  .grid{display:grid;grid-template-columns:1fr;gap:12px;}
  @media (min-width:560px){ .grid.cols-2{grid-template-columns:1fr 1fr;} }
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
  .field input,.field select{
    width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:4px;
    font-size:13.5px;color:var(--ink);background:#fdfcf9;
  }
  .field input:focus,.field select:focus{outline:2px solid var(--gold);outline-offset:0;}
  .section-label{
    font-size:11.5px;font-weight:600;color:var(--gold);margin:18px 0 8px;
    padding-top:12px;border-top:1px solid var(--line);
  }
  .section-label:first-child{margin-top:0;padding-top:0;border-top:none;}

  .btn{
    appearance:none;border:1px solid var(--navy);background:var(--navy);color:#fff;
    padding:9px 16px;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .btn.secondary{background:#fff;color:var(--navy);}
  .btn.ghost{background:transparent;border-color:var(--border);color:var(--muted);}
  .btn.danger{background:#fff;color:var(--danger);border-color:var(--danger);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}

  /* Contract paper preview */
  .paper{
    background:var(--paper);border:1px solid var(--border);
    padding:34px 28px;font-family:'Times New Roman',Georgia,serif;
    color:#1a1a1a;font-size:12.8px;line-height:1.6;
    font-variant-numeric:lining-nums;
  }
  .paper h3{
    text-align:center;font-size:15px;letter-spacing:.5px;margin:0 0 6px;
  }
  .paper .legal-ref{text-align:center;font-size:11.5px;font-style:italic;color:#444;margin:0 0 20px;}
  .paper .party{margin:10px 0;}
  .paper .party u{text-decoration:underline;}
  .paper .art{margin:14px 0;page-break-inside:avoid;break-inside:avoid;}
  .paper li{page-break-inside:avoid;break-inside:avoid;}
  .paper .party{page-break-inside:avoid;break-inside:avoid;}
  .paper .sign{page-break-inside:avoid;break-inside:avoid;}
  .paper .art b.title{display:block;margin-bottom:3px;text-decoration:underline;}
  .paper ul{margin:6px 0;padding-left:20px;}
  .paper li{margin:3px 0;}
  .paper .sign{display:flex;justify-content:space-between;margin-top:40px;font-size:12.5px;}
  .paper .sign div{width:46%;}
  .paper .sign .line{border-top:1px solid #999;margin-top:44px;padding-top:4px;font-size:11px;color:#555;}

  /* Archive list */
  .archive-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 4px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap;
  }
  .archive-item:last-child{border-bottom:none;}
  .archive-item .info b{display:block;font-size:14px;color:var(--navy);}
  .archive-item .info span{font-size:12px;color:var(--muted);}
  .empty{color:var(--muted);font-size:13px;padding:14px 4px;}

  /* Suivi table */
  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  th{
    text-align:left;font-size:11px;text-transform:none;color:var(--muted);
    border-bottom:1px solid var(--border);padding:8px 8px;white-space:nowrap;
  }
  td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
  tr.expired td{background:var(--danger-bg);}
  tr.soon td{background:var(--warn-bg);}
  .badge{
    display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;
  }
  .badge.ok{background:var(--ok-bg);color:var(--ok);}
  .badge.soon{background:var(--warn-bg);color:var(--warn);}
  .badge.expired{background:var(--danger-bg);color:var(--danger);}
  .pay-toggle{
    border:1px solid var(--border);background:#fff;border-radius:4px;padding:4px 8px;
    font-size:11.5px;cursor:pointer;font-weight:600;
  }
  .pay-toggle.paid{background:var(--ok-bg);color:var(--ok);border-color:var(--ok);}
  .pay-toggle.unpaid{background:var(--danger-bg);color:var(--danger);border-color:var(--danger);}
  .table-wrap{overflow-x:auto;}
  .note{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5;}

  .field input[type="file"]{padding:6px;font-size:12.5px;background:#fdfcf9;}
  .ocr-status{display:block;font-size:11.5px;margin-top:4px;color:var(--muted);}
  .ocr-status.found{color:var(--ok);}
  .ocr-status.busy{color:var(--gold);}
  .attach-box{margin-top:14px;}
  .attach-item{
    display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);
  }
  .attach-item img{width:48px;height:48px;object-fit:cover;border-radius:4px;border:1px solid var(--border);}
  .attach-item a{font-size:12.5px;color:var(--navy);font-weight:600;text-decoration:none;}

  .auth-wrap{
    max-width:360px;margin:60px auto;padding:0 20px;
  }
  .auth-card{
    background:#fff;border:1px solid var(--border);border-radius:8px;padding:26px 22px;
  }
  .auth-card h2{margin:0 0 4px;font-size:17px;color:var(--navy);}
  .auth-card p.sub{margin:0 0 18px;font-size:12.5px;color:var(--muted);}
  .auth-card .field{margin-bottom:12px;}
  .auth-card .btn{width:100%;margin-top:6px;}
  .auth-switch{margin-top:16px;font-size:12.5px;text-align:center;color:var(--muted);}
  .auth-switch a{color:var(--navy);font-weight:600;text-decoration:none;cursor:pointer;}
  .auth-error{background:var(--danger-bg);color:var(--danger);padding:8px 10px;border-radius:4px;font-size:12.5px;margin-bottom:12px;}
  .logout-btn{
    background:transparent;border:1px solid rgba(255,255,255,.3);color:#f2efe8;
    padding:5px 12px;border-radius:4px;font-size:12px;cursor:pointer;float:right;
  }

  /* Sections (Contrats / Attestations) */
  nav.sections{display:flex;background:var(--navy);padding:0 24px;gap:6px;}
  nav.sections button{
    appearance:none;border:1px solid rgba(255,255,255,.18);background:transparent;color:#c7cede;
    padding:7px 12px;margin:0 0 10px;border-radius:4px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  nav.sections button.active{background:var(--gold);border-color:var(--gold);color:#fff;}
  nav.tabs{overflow-x:auto;}
  nav.tabs button{white-space:nowrap;}

  /* Attestation page (A4 = 794 x 1123 px) */
  .att-frame{position:relative;width:100%;overflow:hidden;border:1px solid var(--border);background:#fff;}
  .att-scaler{width:794px;height:1123px;transform-origin:top left;}
  .att-page{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;
    font-family:'Times New Roman',Times,Georgia,serif;color:#111;}
  .att-page .att-bg{position:absolute;left:0;top:0;width:794px;height:1123px;}
  .att-page .att-body{position:absolute;left:88px;right:88px;top:205px;font-size:15.5px;line-height:1.55;font-style:italic;}
  .att-page .att-title{text-align:center;font-style:normal;font-weight:700;font-size:21px;
    text-decoration:underline;letter-spacing:.5px;margin:0 0 34px;}
  .att-page .att-body p{margin:0 0 11px;text-align:justify;text-indent:40px;}
  .att-page .att-sign{position:relative;margin-top:30px;text-align:right;}
  .att-page .att-sign p{text-indent:0;margin:0 0 6px;text-align:right;text-decoration:underline;position:relative;z-index:1;}
  .att-page .att-body p.att-ice{text-indent:0;text-align:left;margin-top:40px;}
  .att-page .att-cachet{position:absolute;right:30px;top:52px;max-width:190px;max-height:140px;z-index:2;}

  .att-page .res-title{text-align:center;font-style:normal;font-weight:700;font-size:21px;text-decoration:underline;letter-spacing:.5px;margin:0 0 30px;line-height:1.35;}
  .att-page .res-body{position:absolute;left:88px;right:88px;top:200px;font-size:15.5px;line-height:1.6;}
  .att-page .res-body p{margin:0 0 12px;text-align:justify;}
  .att-page .res-party{padding-left:28px;text-indent:-22px;}
  .att-page .res-sign{display:flex;justify-content:space-between;margin-top:34px;}
  .att-page .res-sign > div{width:46%;position:relative;}
  .att-page .res-sign p{margin:0 0 4px;text-align:left;}
  .att-page .res-sign .r p{text-align:right;}
  .att-page .res-cachet{position:absolute;left:0;top:78px;max-width:190px;max-height:140px;}
  .gerant-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;}
  .gerant-row select{width:84px;padding:8px 6px;border:1px solid var(--border);border-radius:4px;font-size:13.5px;background:#fdfcf9;}
  .gerant-row input{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:4px;font-size:13.5px;background:#fdfcf9;}
  .gerant-row .btn{padding:8px 11px;}
  .cachet-box{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .cachet-box img{max-width:140px;max-height:100px;border:1px dashed var(--border);border-radius:4px;
    background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/14px 14px;}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:10px;}
  .check input{width:16px;height:16px;}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .stat{border:1px solid var(--border);border-radius:6px;padding:10px 14px;min-width:120px;background:#fdfcf9;}
  .stat b{display:block;font-size:20px;color:var(--navy);}
  .stat span{font-size:11.5px;color:var(--muted);}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;}
  .toolbar .field{flex:1;min-width:160px;}

  /* Print */
  @media print{
    .att-frame{height:auto!important;overflow:visible!important;border:none!important;}
    .att-scaler{transform:none!important;}
    body *{visibility:hidden;}
    #print-area,#print-area *{visibility:visible;}
    #print-area{position:absolute;top:0;left:0;width:100%;padding:0;border:none;}
    header.top,nav.tabs{display:none;}
  }
</style>
</head>
<body>
<div class="app">

<script type="module">

function compressImage(file, maxWidth, quality){
  maxWidth = maxWidth || 1000; quality = quality || 0.6;
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function tryOCR(dataUrl){
  if(!window.Tesseract) return '';
  try{
    const result = await Tesseract.recognize(dataUrl, 'eng');
    return (result && result.data && result.data.text) || '';
  }catch(e){
    console.error('OCR erreur', e);
    return '';
  }
}
function extractCIN(text){
  const m = text.match(/\b([A-Z]{1,2}[\s-]?\d{5,7})\b/);
  return m ? m[1].replace(/[\s-]/g,'') : '';
}
function extractICE(text){
  const m = text.match(/\b(\d{15})\b/);
  return m ? m[1] : '';
}

async function loadContracts(){
  try{
    const snap = await getDocs(collection(db, 'users', currentUser.uid, 'contracts'));
    contracts = snap.docs.map(function(d){ return d.data(); });
  }catch(e){
    console.error(e);
    contracts = [];
  }
}
async function saveContractDoc(contract){
  try{
    await setDoc(doc(db, 'users', currentUser.uid, 'contracts', contract.numero), contract);
    return true;
  }catch(e){
    console.error('Erreur de sauvegarde', e);
    alert('Attention : la sauvegarde a échoué. Vérifie ta connexion internet et réessaie.');
    return false;
  }
}
async function deleteContractDoc(numero){

}
async function updateContractField(numero, fields){

  catch(e){ console.error(e); alert('La mise à jour a échoué. Vérifie ta connexion internet.'); return false; }
}

async function downloadPDF(elementId, filename){
  const el = document.getElementById(elementId);
  if(!el || !window.html2canvas || !window.jspdf){
    alert('Le générateur PDF est en train de charger, réessaie dans quelques secondes.');
    return;
  }
  const btns = document.querySelectorAll('.row-actions button');
  btns.forEach(function(b){ b.disabled = true; });
  try{
    const canvas = await html2canvas(el, {scale:2, backgroundColor:'#fbf9f3', useCORS:true});
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = canvas.height * imgWidth / canvas.width;
    let heightLeft = imgHeight;
    let position = 0;
    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    pdf.save(filename);
  }catch(err){
    console.error('Erreur PDF', err);
    alert('La génération du PDF a échoué sur cet appareil. Réessaie, ou utilise le bouton Imprimer.');
  }finally{
    btns.forEach(function(b){ b.disabled = false; });
  }
}

function escXml(s){
  return (s===undefined||s===null?'':String(s)).replace(/[<>&"]/g, function(c){
    return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];
  });
}

function xRun(text, opts){
  opts = opts || {};
  let rpr = '';
  if(opts.bold) rpr += '<w:b/>';
  if(opts.underline) rpr += '<w:u w:val="single"/>';
  if(opts.italic) rpr += '<w:i/>';
  if(opts.size) rpr += '<w:sz w:val="' + opts.size + '"/><w:szCs w:val="' + opts.size + '"/>';
  rpr += '<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>';
  const rprXml = '<w:rPr>' + rpr + '</w:rPr>';
  return '<w:r>' + rprXml + '<w:t xml:space="preserve">' + escXml(text) + '</w:t></w:r>';
}

function xBreak(){ return '<w:r><w:br/></w:r>'; }

function xPara(innerRuns, opts){
  opts = opts || {};
  let ppr = '';
  if(opts.center) ppr += '<w:jc w:val="center"/>';
  if(opts.indent) ppr += '<w:ind w:left="' + opts.indent + '"/>';
  ppr += '<w:spacing w:after="' + (opts.after !== undefined ? opts.after : 160) + '"/>';
  return '<w:p><w:pPr>' + ppr + '</w:pPr>' + innerRuns + '</w:p>';
}

  , {after:200}));

  const domicilieTexte = c.representant2

        + ', et Mr ' + c.representant2 + (c.naissance2 ? ', né le ' + fmtDate(c.naissance2) : '') + ', de nationalité ' + (c.nationalite2 || 'marocaine')
        + (c.cin2 ? ', et titulaire de la CIN N° ' + c.cin2 : '') + (c.adresseRep2 ? ', demeurant à ' + c.adresseRep2 : '')

async function downloadDocx(c, filename){
  if(!c){ alert('Impossible de trouver le contrat à exporter.'); return; }
  if(!window.JSZip){ alert('Le générateur Word est en train de charger, réessaie dans quelques secondes.'); return; }
  try{
    const body = contractDocxBody(c);
    const documentXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
      + '<w:body>' + body
      + '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1417" w:right="1417" w:bottom="1417" w:left="1417"/></w:sectPr>'
      + '</w:body></w:document>';
    const contentTypesXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      + '<Default Extension="xml" ContentType="application/xml"/>'
      + '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
      + '</Types>';
    const relsXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'
      + '</Relationships>';
    const zip = new JSZip();
    zip.file('[Content_Types].xml', contentTypesXml);
    zip.folder('_rels').file('.rels', relsXml);
    zip.folder('word').file('document.xml', documentXml);
    const blob = await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(err){
    console.error('Erreur Word', err);
    alert('La génération du fichier Word a échoué sur cet appareil. Réessaie, ou utilise le bouton Télécharger en PDF.');
  }
}

function downloadJSON(){
  const blob = new Blob([JSON.stringify(contracts, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'contrats-domiciliation-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importJSONFile(file){
  const reader = new FileReader();
  reader.onload = async function(e){
    try{
      const imported = JSON.parse(e.target.result);
      if(!Array.isArray(imported)) throw new Error('format invalide');
      let added = 0;
      for(const c of imported){
        if(c && c.numero && !contracts.some(function(x){ return x.numero === c.numero; })){
          contracts.push(c);
          await saveContractDoc(c);
          added++;
        }
      }
      render();
      alert(added + ' contrat(s) importé(s).');
    }catch(err){
      alert('Le fichier importé n\'est pas valide.');
    }
  };
  reader.readAsText(file);
}

function fmtDate(iso){
  if(!iso) return '\u2014';
  const [y,m,d] = iso.split('-');
  return d + '/' + m + '/' + y;
}
function addMonths(iso, months){
  const d = new Date(iso);
  d.setMonth(d.getMonth() + Number(months));
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0,10);
}
function daysLeft(iso){
  const today = new Date(); today.setHours(0,0,0,0);
  const end = new Date(iso); end.setHours(0,0,0,0);
  return Math.round((end-today)/86400000);
}
function nextNumero(){
  const year = new Date().getFullYear();
  const count = contracts.filter(c => (c.numero||'').includes(String(year))).length + 1;
  return 'LC-' + year + '-' + String(count).padStart(3,'0');
}
function esc(s){ return (s||'').toString().replace(/[<>&]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; }); }

function readForm(){
  const v = function(id){ return document.getElementById(id).value.trim(); };
  const dateDebut = v('f-debut');
  const duree = v('f-duree') || '12';
  const rep2Block = document.getElementById('second-rep-block');
  const hasRep2 = rep2Block && rep2Block.style.display !== 'none' && v('f-representant2');
  return {
    numero: v('f-numero') || nextNumero(),
    societe: v('f-societe'),
    ice: v('f-ice'),
    representant: v('f-representant'),
    naissance: v('f-naissance'),
    nationalite: v('f-nationalite'),
    cin: v('f-cin'),
    adresseRep: v('f-adresse-rep'),
    qualite: v('f-qualite'),
    telephone: v('f-telephone'),
    email: v('f-email'),
    intermediaire: v('f-intermediaire'),
    telephoneIntermediaire: v('f-telephone-intermediaire'),
    emailIntermediaire: v('f-email-intermediaire'),
    representant2: hasRep2 ? v('f-representant2') : '',
    naissance2: hasRep2 ? v('f-naissance2') : '',
    nationalite2: hasRep2 ? v('f-nationalite2') : '',
    cin2: hasRep2 ? v('f-cin2') : '',
    adresseRep2: hasRep2 ? v('f-adresse-rep2') : '',
    qualite2: hasRep2 ? v('f-qualite2') : '',
    dateDebut,
    duree,
    dateFin: dateDebut ? addMonths(dateDebut, duree) : '',
    loyer: v('f-loyer'),
    modePaiement: v('f-mode'),
    paye: false,
    attachments: { cin: pendingAttachments.cin || null, cin2: pendingAttachments.cin2 || null, negatif: pendingAttachments.negatif || null },
    createdAt: new Date().toISOString()
  };
}

function startEditContract(c){
  editingNumero = c.numero;
  editingHasAttachments = !!c.hasAttachments;
  previewData = null;
  viewingArchiveId = null;
  activeTab = 'nouveau';
  render();
  fillFormFromContract(c);
}

function fillFormFromContract(c){
  const setVal = function(id, val){ const el = document.getElementById(id); if(el) el.value = (val===undefined||val===null) ? '' : val; };
  setVal('f-numero', c.numero);
  setVal('f-societe', c.societe);
  setVal('f-ice', c.ice);
  setVal('f-representant', c.representant);
  setVal('f-naissance', c.naissance);
  setVal('f-nationalite', c.nationalite || 'Marocaine');
  setVal('f-cin', c.cin);
  setVal('f-adresse-rep', c.adresseRep);
  setVal('f-qualite', c.qualite);
  setVal('f-telephone', c.telephone);
  setVal('f-email', c.email);
  setVal('f-intermediaire', c.intermediaire);
  setVal('f-telephone-intermediaire', c.telephoneIntermediaire);
  setVal('f-email-intermediaire', c.emailIntermediaire);
  if(c.representant2){
    const toggleRep2 = document.getElementById('btn-toggle-rep2');
    const rep2Block = document.getElementById('second-rep-block');
    if(toggleRep2 && rep2Block){ rep2Block.style.display = 'block'; toggleRep2.style.display = 'none'; }
    setVal('f-representant2', c.representant2);
    setVal('f-naissance2', c.naissance2);
    setVal('f-nationalite2', c.nationalite2 || 'Marocaine');
    setVal('f-cin2', c.cin2);
    setVal('f-adresse-rep2', c.adresseRep2);
    setVal('f-qualite2', c.qualite2);
  }
  setVal('f-debut', c.dateDebut);
  setVal('f-duree', c.duree || '12');
  setVal('f-loyer', c.loyer);
  setVal('f-mode', c.modePaiement);
}

function downloadDataUrl(dataUrl, filename){
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

async function loadAttachmentsBox(numero){
  const box = document.getElementById('attachments-box');
  if(!box) return;
  try{
    const snap = await getDoc(doc(db, 'users', currentUser.uid, 'attachments', numero));
    const data = snap.exists() ? snap.data() : {};
    let html = '<p class="section-label" style="margin:0 0 8px;">Pièces jointes</p>';
    ['cin','cin2','negatif'].forEach(function(key){
      const item = data[key];
      const labelMap = { cin: 'Copie CIN', cin2: 'Copie CIN (2ème gérant)', negatif: 'Certificat négatif / ICE' };
      if(item && item.dataUrl){
        html += '<div class="attach-item"><img src="' + item.dataUrl + '" alt=""><div style="flex:1;">'
          + labelMap[key] + '<br><a href="#" class="attach-dl" data-key="' + key + '">Télécharger — ' + esc(item.name||'') + '</a></div></div>';
      }
    });
    box.innerHTML = html || '<p class="empty">Aucune pièce jointe.</p>';
    box.querySelectorAll('.attach-dl').forEach(function(link){
      link.onclick = function(ev){
        ev.preventDefault();
        const item = data[link.dataset.key];
        if(item) downloadDataUrl(item.dataUrl, item.name || (link.dataset.key + '.jpg'));
      };
    });
  }catch(e){
    console.error(e);
    box.innerHTML = '<p class="empty">Impossible de charger les pièces jointes.</p>';
  }
}

function renderAuth(errorMsg){
  const main = document.getElementById('main');
  const title = authMode === 'signup' ? 'Créer un compte' : (authMode === 'reset' ? 'Mot de passe oublié' : 'Connexion');
  const sub = authMode === 'signup' ? 'Crée ton compte pour accéder à l\'application.' :
    (authMode === 'reset' ? 'Reçois un lien par e-mail pour réinitialiser ton mot de passe.' : 'Connecte-toi pour accéder à tes contrats.');
  main.innerHTML = ''
    + '<div class="auth-wrap"><div class="auth-card">'
    + '<h2>' + title + '</h2><p class="sub">' + sub + '</p>'
    + (errorMsg ? '<div class="auth-error">' + esc(errorMsg) + '</div>' : '')
    + '<div class="field"><label>E-mail</label><input type="email" id="auth-email" autocomplete="username"></div>'
    + (authMode !== 'reset' ? '<div class="field"><label>Mot de passe</label><input type="password" id="auth-password" autocomplete="' + (authMode==='signup'?'new-password':'current-password') + '"></div>' : '')
    + '<button class="btn" id="auth-submit">' + (authMode === 'signup' ? 'Créer le compte' : (authMode === 'reset' ? 'Envoyer le lien' : 'Se connecter')) + '</button>'
    + '<div class="auth-switch">'
    + (authMode === 'login' ? 'Pas encore de compte ? <a id="auth-to-signup">Créer un compte</a><br><a id="auth-to-reset">Mot de passe oublié ?</a>' : '')
    + (authMode === 'signup' ? 'Déjà un compte ? <a id="auth-to-login">Se connecter</a>' : '')
    + (authMode === 'reset' ? '<a id="auth-to-login">Retour à la connexion</a>' : '')
    + '</div></div></div>';

  const toSignup = document.getElementById('auth-to-signup');
  if(toSignup) toSignup.onclick = function(){ authMode = 'signup'; renderAuth(); };
  const toLogin = document.getElementById('auth-to-login');
  if(toLogin) toLogin.onclick = function(){ authMode = 'login'; renderAuth(); };
  const toReset = document.getElementById('auth-to-reset');
  if(toReset) toReset.onclick = function(){ authMode = 'reset'; renderAuth(); };

  document.getElementById('auth-submit').onclick = async function(){
    const email = document.getElementById('auth-email').value.trim();
    const password = authMode !== 'reset' ? document.getElementById('auth-password').value : null;
    if(!email || (authMode !== 'reset' && !password)){
      renderAuth('Merci de remplir tous les champs.');
      return;
    }
    try{
      if(authMode === 'signup'){
        await createUserWithEmailAndPassword(auth, email, password);
      } else if(authMode === 'reset'){
        await sendPasswordResetEmail(auth, email);
        alert('Un e-mail de réinitialisation a été envoyé si ce compte existe.');
        authMode = 'login';
        renderAuth();
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
    }catch(e){
      const map = {
        'auth/invalid-email': 'Adresse e-mail invalide.',
        'auth/user-not-found': 'Aucun compte avec cet e-mail.',
        'auth/wrong-password': 'Mot de passe incorrect.',
        'auth/invalid-credential': 'E-mail ou mot de passe incorrect.',
        'auth/email-already-in-use': 'Un compte existe déjà avec cet e-mail.',
        'auth/weak-password': 'Le mot de passe doit contenir au moins 6 caractères.'
      };
      renderAuth(map[e.code] || 'Une erreur est survenue. Réessaie.');
    }
  };
}

onAuthStateChanged(auth, async function(user){
  currentUser = user;
  const nav = document.getElementById('main-nav');
  const logoutBtn = document.getElementById('btn-logout');
  if(user){
    nav.style.display = 'block';
    logoutBtn.style.display = 'inline-block';
    await Promise.all([loadContracts(), loadAttestations(), loadResiliations(), loadCachet()]);
    render();
  } else {
    nav.style.display = 'none';
    logoutBtn.style.display = 'none';
    contracts = [];
    attestations = [];
    resiliations = [];
    cachet = null;
    authMode = 'login';
    renderAuth();
  }
});

document.getElementById('btn-logout').onclick = function(){ signOut(auth); };

function render(){
  const activeSection = activeTab.indexOf('att-') === 0 ? 'attestations' : (activeTab.indexOf('res-') === 0 ? 'resiliations' : 'contrats');
  const sub = activeTab.replace(/^(att|res)-/,'');
  document.querySelectorAll('nav.sections button').forEach(function(b){
    b.classList.toggle('active', b.dataset.section === activeSection);
  });
  document.querySelectorAll('nav.tabs button').forEach(function(b){
    b.classList.toggle('active', b.dataset.tab === sub);
    if(b.dataset.tab === 'nouveau') b.textContent = activeSection === 'contrats' ? 'Nouveau contrat' : (activeSection === 'attestations' ? 'Nouvelle attestation' : 'Nouvelle résiliation');
  });
  const main = document.getElementById('main');
  if(activeTab === 'nouveau') main.innerHTML = viewNouveau();
  if(activeTab === 'archive') main.innerHTML = viewArchive();
  if(activeTab === 'suivi') main.innerHTML = viewSuivi();
  if(activeTab === 'att-nouveau') main.innerHTML = viewAttNouveau();
  if(activeTab === 'att-archive') main.innerHTML = viewAttArchive();
  if(activeTab === 'att-suivi') main.innerHTML = viewAttSuivi();
  if(activeTab === 'res-nouveau') main.innerHTML = viewResNouveau();
  if(activeTab === 'res-archive') main.innerHTML = viewResArchive();
  if(activeTab === 'res-suivi') main.innerHTML = viewResSuivi();
  attachHandlers();
  if(activeSection === 'attestations'){ attachAttHandlers(); fitAttPages(); }
  if(activeSection === 'resiliations'){ attachResHandlers(); fitAttPages(); }
  if(activeTab === 'archive' && viewingArchiveId){
    const viewing = contracts.find(function(c){ return c.numero===viewingArchiveId; });
    if(viewing && viewing.hasAttachments) loadAttachmentsBox(viewingArchiveId);
  }
}

    + '<input type="file" id="btn-import" accept="application/json" style="display:none;">'
    + '</div>';
  contracts.slice().reverse().forEach(function(c){
    html += ''
      + '<div class="archive-item">'
      + '<div class="info"><b>' + (esc(c.societe)||'(sans nom)') + '</b>'
      + '<span>N° ' + esc(c.numero) + ' — représentant : ' + (esc(c.representant)||'\u2014') + ' — ' + fmtDate(c.dateDebut) + ' \u2192 ' + fmtDate(c.dateFin) + '</span></div>'
      + '<div class="row-actions" style="margin-top:0;">'
      + '<button class="btn ghost btn-voir" data-id="' + esc(c.numero) + '">Voir</button>'
      + '<button class="btn ghost btn-modifier" data-id="' + esc(c.numero) + '">Modifier</button>'
      + '<button class="btn danger btn-suppr" data-id="' + esc(c.numero) + '">Supprimer</button>'
      + '</div></div>';
  });
  html += '</div>';
  if(viewing){
    html += ''
      + '<div class="card">'
      + '<h2>Contrat N° ' + esc(viewing.numero) + '</h2>'
      + '<div class="paper" id="print-area">' + contractPaperHTML(viewing) + '</div>'
      + (viewing.hasAttachments ? '<div class="attach-box" id="attachments-box"><p class="sub">Chargement des pièces jointes...</p></div>' : '')
      + '<div class="row-actions">'
      + '<button class="btn secondary" id="btn-pdf-archive">Télécharger en PDF</button>'
      + '<button class="btn secondary" id="btn-word-archive">Télécharger en Word</button>'
      + '<button class="btn ghost" id="btn-imprimer-archive">Imprimer</button>'
      + '<button class="btn ghost" id="btn-fermer-archive">Fermer</button>'
      + '</div></div>';
  }
  return html;
}

/* ---- Rappels email de renouvellement ---- */
function renouvellementEmail(c){
  const left = daysLeft(c.dateFin);
  const subject = 'Renouvellement de votre contrat de domiciliation — ' + (c.societe||'');
  const etat = left < 0
    ? 'est arrivé à échéance le ' + fmtDate(c.dateFin)
    : 'arrive à échéance le ' + fmtDate(c.dateFin) + ' (dans ' + left + ' jour' + (left>1?'s':'') + ')';
  const body = 'Bonjour ' + (c.representant||'') + ',\n\n'
    + 'Nous vous informons que le contrat de domiciliation N° ' + (c.numero||'') + ' de la société ' + (c.societe||'')
    + ' ' + etat + '.\n\n'
    + 'Afin d\'assurer la continuité de la domiciliation de votre siège social, merci de nous contacter pour procéder à son renouvellement'
    + (c.loyer ? ' (loyer mensuel : ' + c.loyer + ' DH)' : '') + '.\n\n'
    + 'Nous restons à votre disposition pour toute information.\n\n'
    + 'Cordialement,\nOmar LAMINE\nLAMINE CONSEIL\nRue Goulmima, Résidence Le Louvre, N°653, 4ème étage, Appt 11, Casablanca';
  return { subject: subject, body: body };
}
function rappelCell(c){
  const last = c.dernierRappel ? '<span style="font-size:11.5px;color:var(--ok);">Envoyé le ' + fmtDate(String(c.dernierRappel).slice(0,10)) + '</span> ' : '';
  const dest = c.email || c.emailIntermediaire;
  if(!dest) return last + '<span style="font-size:11.5px;color:var(--muted);">Pas d\'email</span>';
  const m = renouvellementEmail(c);
  const href = 'mailto:' + encodeURIComponent(dest)
    + '?subject=' + encodeURIComponent(m.subject)
    + (c.email && c.emailIntermediaire ? '&cc=' + encodeURIComponent(c.emailIntermediaire) : '')
    + '&body=' + encodeURIComponent(m.body);
  return last + '<a class="pay-toggle" style="text-decoration:none;color:var(--navy);" href="' + href + '" title="Envoyer un rappel manuellement">✉</a>';
}

function viewSuivi(){
  if(!contracts.length) return '<div class="card"><h2>Suivi</h2><p class="empty">Aucun contrat à suivre pour l\'instant. Crée un contrat depuis l\'onglet "Nouveau contrat".</p></div>';
  const rows = contracts.slice().sort(function(a,b){ return new Date(a.dateFin) - new Date(b.dateFin); });
  let body = '';
  rows.forEach(function(c){
    const left = daysLeft(c.dateFin);
    const cls = left < 0 ? 'expired' : (left <= 30 ? 'soon' : '');
    const badge = left < 0
      ? '<span class="badge expired">Expiré depuis ' + Math.abs(left) + ' j</span>'
      : (left <= 30 ? '<span class="badge soon">' + left + ' j restants</span>' : '<span class="badge ok">' + left + ' j restants</span>');
    body += ''
      + '<tr class="' + cls + '">'
      + '<td>' + (esc(c.societe)||'\u2014') + '</td>'
      + '<td>' + (esc(c.representant)||'\u2014') + '</td>'
      + '<td>' + (esc(c.telephone)||'\u2014') + '</td>'
      + '<td>' + (esc(c.email)||'\u2014') + '</td>'
      + '<td>' + (esc(c.intermediaire)||'\u2014') + '</td>'
      + '<td>' + (esc(c.telephoneIntermediaire)||'\u2014') + '</td>'
      + '<td>' + (esc(c.emailIntermediaire)||'\u2014') + '</td>'
      + '<td>' + esc(c.numero) + '</td>'
      + '<td>' + fmtDate(c.dateDebut) + '</td>'
      + '<td>' + fmtDate(c.dateFin) + '</td>'
      + '<td>' + (esc(c.modePaiement)||'\u2014') + '</td>'
      + '<td>' + badge + '</td>'
      + '<td>' + rappelCell(c) + '</td>'
      + '<td><button class="pay-toggle ' + (c.paye?'paid':'unpaid') + ' btn-pay" data-id="' + esc(c.numero) + '">' + (c.paye?'Payé':'Non payé') + '</button></td>'
      + '</tr>';
  });
  return ''
    + '<div class="card">'
    + '<h2>Suivi des contrats</h2>'
    + '<p class="sub">Les contrats bientôt échus (30 jours) ou expirés sont mis en évidence.</p>'
    + '<div class="table-wrap"><table><thead><tr>'
    + '<th>Société</th><th>Représentant</th><th>Téléphone gérant</th><th>Email gérant</th>'
    + '<th>Intermédiaire</th><th>Téléphone intermédiaire</th><th>Email intermédiaire</th>'
    + '<th>N° contrat</th><th>Début</th><th>Fin</th><th>Mode paiement</th><th>Statut</th><th>Rappel email</th><th>Paiement</th>'
    + '</tr></thead><tbody>' + body + '</tbody></table></div>'
    + '<p class="note">Rappels automatiques : chaque matin, un e-mail de renouvellement est envoyé au gérant '
    + '(ou à l\'intermédiaire si le gérant n\'a pas d\'email) 30 jours avant l\'échéance, 7 jours avant, puis le lendemain de l\'expiration. '
    + 'La colonne "Rappel email" montre le dernier envoi. Le bouton ✉ permet d\'envoyer un rappel manuellement.</p>'
    + '</div>';
}

function attachHandlers(){
  document.querySelectorAll('nav.tabs button').forEach(function(b){
    b.onclick = function(){
      const inAtt = activeTab.indexOf('att-') === 0;
      const inRes = activeTab.indexOf('res-') === 0;
      if(inAtt){ saveAttDraft(); }
      if(inRes){ saveResDraft(); }
      activeTab = (inAtt ? 'att-' : (inRes ? 'res-' : '')) + b.dataset.tab;
      if(activeTab!=='res-archive') viewingResId=null;
      if(activeTab!=='archive') viewingArchiveId=null;
      if(activeTab!=='att-archive') viewingAttId=null;
      render();
    };
  });
  document.querySelectorAll('nav.sections button').forEach(function(b){
    b.onclick = function(){
      if(activeTab.indexOf('att-') === 0) saveAttDraft();
      if(activeTab.indexOf('res-') === 0) saveResDraft();
      activeTab = b.dataset.section === 'attestations' ? 'att-nouveau' : (b.dataset.section === 'resiliations' ? 'res-nouveau' : 'nouveau');
      viewingArchiveId = null; viewingAttId = null; viewingResId = null;
      render();
    };
  });

  const fileCin = document.getElementById('f-file-cin');
  if(fileCin) fileCin.onchange = async function(){
    const file = fileCin.files && fileCin.files[0];
    const status = document.getElementById('ocr-status-cin');
    if(!file) return;
    if(status) { status.textContent = 'Lecture en cours...'; status.className = 'ocr-status busy'; }
    try{
      const dataUrl = await compressImage(file);
      pendingAttachments.cin = { name: file.name, dataUrl };
      const text = await tryOCR(dataUrl);
      const cin = extractCIN(text);
      const cinField = document.getElementById('f-cin');
      if(cin && cinField && !cinField.value){
        cinField.value = cin;
        if(status){ status.textContent = 'CIN détectée : ' + cin + ' (vérifie)'; status.className = 'ocr-status found'; }
      } else if(status){
        status.textContent = 'Fichier joint. Lecture automatique non concluante, remplis la CIN manuellement.';
        status.className = 'ocr-status';
      }
    }catch(e){
      console.error(e);
      if(status){ status.textContent = 'Fichier joint (lecture automatique indisponible).'; status.className = 'ocr-status'; }
    }
  };

  const fileCin2 = document.getElementById('f-file-cin2');
  if(fileCin2) fileCin2.onchange = async function(){
    const file = fileCin2.files && fileCin2.files[0];
    const status = document.getElementById('ocr-status-cin2');
    if(!file) return;
    if(status) { status.textContent = 'Lecture en cours...'; status.className = 'ocr-status busy'; }
    try{
      const dataUrl = await compressImage(file);
      pendingAttachments.cin2 = { name: file.name, dataUrl };
      const text = await tryOCR(dataUrl);
      const cin = extractCIN(text);
      const cinField2 = document.getElementById('f-cin2');
      if(cin && cinField2 && !cinField2.value){
        cinField2.value = cin;
        if(status){ status.textContent = 'CIN détectée : ' + cin + ' (vérifie)'; status.className = 'ocr-status found'; }
      } else if(status){
        status.textContent = 'Fichier joint. Lecture automatique non concluante, remplis la CIN manuellement.';
        status.className = 'ocr-status';
      }
    }catch(e){
      console.error(e);
      if(status){ status.textContent = 'Fichier joint (lecture automatique indisponible).'; status.className = 'ocr-status'; }
    }
  };

  const fileNegatif = document.getElementById('f-file-negatif');
  if(fileNegatif) fileNegatif.onchange = async function(){
    const file = fileNegatif.files && fileNegatif.files[0];
    const status = document.getElementById('ocr-status-negatif');
    if(!file) return;
    if(status) { status.textContent = 'Lecture en cours...'; status.className = 'ocr-status busy'; }
    try{
      const dataUrl = await compressImage(file);
      pendingAttachments.negatif = { name: file.name, dataUrl };
      const text = await tryOCR(dataUrl);
      const ice = extractICE(text);
      const iceField = document.getElementById('f-ice');
      if(ice && iceField && !iceField.value){
        iceField.value = ice;
        if(status){ status.textContent = 'ICE détecté : ' + ice + ' (vérifie)'; status.className = 'ocr-status found'; }
      } else if(status){
        status.textContent = 'Fichier joint. Lecture automatique non concluante, remplis l\'ICE manuellement.';
        status.className = 'ocr-status';
      }
    }catch(e){
      console.error(e);
      if(status){ status.textContent = 'Fichier joint (lecture automatique indisponible).'; status.className = 'ocr-status'; }
    }
  };

  const toggleRep2 = document.getElementById('btn-toggle-rep2');
  const rep2Block = document.getElementById('second-rep-block');
  if(toggleRep2 && rep2Block) toggleRep2.onclick = function(){
    rep2Block.style.display = 'block';
    toggleRep2.style.display = 'none';
  };
  const removeRep2 = document.getElementById('btn-remove-rep2');
  if(removeRep2 && rep2Block && toggleRep2) removeRep2.onclick = function(){
    rep2Block.style.display = 'none';
    toggleRep2.style.display = 'inline-block';
    ['f-representant2','f-qualite2','f-naissance2','f-cin2','f-adresse-rep2'].forEach(function(id){
      const el = document.getElementById(id);
      if(el) el.value = '';
    });
    document.getElementById('f-nationalite2').value = 'Marocaine';
  };

  const genBtn = document.getElementById('btn-generer');
  if(genBtn) genBtn.onclick = function(){
    const data = readForm();
    if(!data.societe || !data.dateDebut){
      alert('Merci de renseigner au moins le nom de la société et la date de début.');
      return;
    }
    previewData = data;
    render();
  };

  const saveBtn = document.getElementById('btn-enregistrer');
  if(saveBtn) saveBtn.onclick = async function(){
    const isEditing = editingNumero && editingNumero === previewData.numero;
    if(!isEditing && contracts.some(function(c){ return c.numero === previewData.numero; })){
      alert('Ce numéro de contrat existe déjà dans l\'archive. Change le numéro.');
      return;
    }
    saveBtn.disabled = true;
    const rawAttachments = previewData.attachments || {};
    const attachmentsToSave = {};
    ['cin','cin2','negatif'].forEach(function(key){
      if(rawAttachments[key]) attachmentsToSave[key] = rawAttachments[key];
    });
    const newlyUploaded = Object.keys(attachmentsToSave).length > 0;
    const hasAttachments = newlyUploaded || (isEditing && editingHasAttachments);
    if(newlyUploaded){
      const sizeCheck = JSON.stringify(attachmentsToSave).length;
      if(sizeCheck > 900000){
        alert('Les pièces jointes sont trop volumineuses pour être sauvegardées. Le contrat sera enregistré sans elles — réessaie avec des photos plus légères si besoin.');
      } else {
        try{
          await setDoc(doc(db, 'users', currentUser.uid, 'attachments', previewData.numero), attachmentsToSave, { merge: true });
        }catch(e){
          console.error('Erreur sauvegarde pièces jointes', e);
          alert('Les pièces jointes n\'ont pas pu être sauvegardées. Le contrat sera quand même enregistré sans elles.');
        }
      }
    }
    const toSave = Object.assign({}, previewData, { hasAttachments: hasAttachments });
    if(isEditing){
      const prev = contracts.find(function(c){ return c.numero === editingNumero; }) || {};
      if(prev.rappels && prev.dateFin === toSave.dateFin){ toSave.rappels = prev.rappels; toSave.dernierRappel = prev.dernierRappel || null; }
    }
    delete toSave.attachments;
    const ok = await saveContractDoc(toSave);
    if(ok){
      const existingIdx = contracts.findIndex(function(c){ return c.numero === toSave.numero; });
      if(existingIdx > -1){ contracts[existingIdx] = toSave; } else { contracts.push(toSave); }
      previewData = null;
      editingNumero = null;
      editingHasAttachments = false;
      pendingAttachments = {};
      activeTab = 'archive';
      render();
    }
    saveBtn.disabled = false;
  };

  const printBtn = document.getElementById('btn-imprimer');
  if(printBtn) printBtn.onclick = function(){ window.print(); };

  const pdfBtn = document.getElementById('btn-pdf');
  if(pdfBtn) pdfBtn.onclick = function(){
    downloadPDF('print-area', 'contrat-' + (previewData.numero||'contrat') + '.pdf');
  };

  const wordBtn = document.getElementById('btn-word');
  if(wordBtn) wordBtn.onclick = function(){
    downloadDocx(previewData, 'contrat-' + (previewData.numero||'contrat') + '.docx');
  };

  const printArchiveBtn = document.getElementById('btn-imprimer-archive');
  if(printArchiveBtn) printArchiveBtn.onclick = function(){ window.print(); };

  const pdfArchiveBtn = document.getElementById('btn-pdf-archive');
  if(pdfArchiveBtn) pdfArchiveBtn.onclick = function(){
    const c = contracts.find(function(c){ return c.numero === viewingArchiveId; });
    downloadPDF('print-area', 'contrat-' + (c ? c.numero : 'contrat') + '.pdf');
  };

  const wordArchiveBtn = document.getElementById('btn-word-archive');
  if(wordArchiveBtn) wordArchiveBtn.onclick = function(){
    const c = contracts.find(function(c){ return c.numero === viewingArchiveId; });
    downloadDocx(c, 'contrat-' + (c ? c.numero : 'contrat') + '.docx');
  };

  const closeArchiveBtn = document.getElementById('btn-fermer-archive');
  if(closeArchiveBtn) closeArchiveBtn.onclick = function(){ viewingArchiveId = null; render(); };

  const exportBtn = document.getElementById('btn-export');
  if(exportBtn) exportBtn.onclick = function(){ downloadJSON(); };

  const importTrigger = document.getElementById('btn-import-trigger');
  const importInput = document.getElementById('btn-import');
  if(importTrigger && importInput){
    importTrigger.onclick = function(){ importInput.click(); };
    importInput.onchange = function(){
      if(importInput.files && importInput.files[0]) importJSONFile(importInput.files[0]);
    };
  }

  document.querySelectorAll('.btn-voir').forEach(function(b){
    b.onclick = function(){ viewingArchiveId = b.dataset.id; render(); };
  });
  document.querySelectorAll('.btn-modifier').forEach(function(b){
    b.onclick = function(){
      const c = contracts.find(function(c){ return c.numero === b.dataset.id; });
      if(c) startEditContract(c);
    };
  });
  document.querySelectorAll('.btn-suppr').forEach(function(b){
    b.onclick = async function(){
      if(!confirm('Supprimer définitivement ce contrat de l\'archive ?')) return;
      const target = contracts.find(function(c){ return c.numero === b.dataset.id; });
      contracts = contracts.filter(function(c){ return c.numero !== b.dataset.id; });
      if(viewingArchiveId === b.dataset.id) viewingArchiveId = null;
      await deleteContractDoc(b.dataset.id);
      if(target && target.hasAttachments){
        try{ await deleteDoc(doc(db, 'users', currentUser.uid, 'attachments', target.numero)); }catch(e){ console.error(e); }
      }
      render();
    };
  });
  document.querySelectorAll('.btn-pay').forEach(function(b){
    b.onclick = async function(){
      const c = contracts.find(function(c){ return c.numero === b.dataset.id; });
      if(c){
        const newVal = !c.paye;
        const ok = await updateContractField(c.numero, { paye: newVal });
        if(ok){ c.paye = newVal; render(); }
      }
    };
  });
}

function todayISO(){
  const t = new Date();
  return t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
}
function nextAttNumero(){
  const year = new Date().getFullYear();
  const prefix = 'AT-' + year + '-';
  let max = 0;
  attestations.forEach(function(a){
    if((a.numero||'').indexOf(prefix) === 0){
      const n = parseInt(a.numero.slice(prefix.length), 10);
      if(!isNaN(n) && n > max) max = n;
    }
  });
  return prefix + String(max + 1).padStart(3,'0');
}

/* Cachet : redimensionne, et rend le fond blanc transparent si demandé */
function processCachet(file, removeWhite, maxW){
  maxW = maxW || 500;
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        if(removeWhite){
          const data = ctx.getImageData(0, 0, w, h);
          const p = data.data;
          for(let i = 0; i < p.length; i += 4){
            const lum = (p[i] + p[i+1] + p[i+2]) / 3;
            if(lum > 225) p[i+3] = 0;
            else if(lum > 190) p[i+3] = Math.round(p[i+3] * (225 - lum) / 35);
          }
          ctx.putImageData(data, 0, 0);
        }
        resolve({ dataUrl: canvas.toDataURL('image/png'), w: w, h: h });
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function downloadAttPDF(a){
  if(!window.html2canvas || !window.jspdf){ alert('Le générateur PDF est en train de charger, réessaie dans quelques secondes.'); return; }
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;height:1123px;';
  holder.innerHTML = attestationPageHTML(a);
  document.body.appendChild(holder);
  try{
    await Promise.all(Array.prototype.map.call(holder.querySelectorAll('img'), function(img){
      return img.complete ? Promise.resolve() : new Promise(function(r){ img.onload = img.onerror = r; });
    }));
    const canvas = await html2canvas(holder.firstElementChild, {scale:2, backgroundColor:'#ffffff', useCORS:true, width:794, height:1123});
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
    pdf.save(attFileName(a, 'pdf'));
  }catch(err){
    console.error(err);
    alert('La génération du PDF a échoué sur cet appareil. Réessaie, ou utilise le bouton Imprimer.');
  }finally{
    document.body.removeChild(holder);
  }
}

  let ppr = '';
  if(o.jc) ppr += '<w:jc w:val="' + o.jc + '"/>';
  if(o.left || o.first) ppr += '<w:ind' + (o.left ? ' w:left="' + o.left + '"' : '') + (o.first ? ' w:firstLine="' + o.first + '"' : '') + '/>';
  ppr += '<w:spacing' + (o.before ? ' w:before="' + o.before + '"' : '') + ' w:after="' + (o.after !== undefined ? o.after : 160) + '" w:line="' + (o.line || 312) + '" w:lineRule="auto"/>';
  return '<w:p><w:pPr>' + ppr + '</w:pPr>' + runs + '</w:p>';
}
function wR(text, o){
  o = o || {};
  return xRun(text, { bold:o.b, italic:o.i !== false, underline:o.u, size:o.size || 23 });
}

/* ---- Formulaire ---- */
function readAttForm(){
  const v = function(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const chk = document.getElementById('a-cachet');
  return {
    numero: v('a-numero') || (attEditing || nextAttNumero()),
    denomination: v('a-denomination').toUpperCase(),
    forme: v('a-forme'),
    date: v('a-date') || todayISO(),
    telephone: v('a-telephone'),
    intermediaire: v('a-intermediaire'),
    montant: v('a-montant'),
    avecCachet: chk ? chk.checked : false,
    paye: attEditing ? (((attestations.find(function(x){ return x.numero === attEditing; }) || {}).paye) || false) : false,
    createdAt: attEditing ? (((attestations.find(function(x){ return x.numero === attEditing; }) || {}).createdAt) || new Date().toISOString()) : new Date().toISOString()
  };
}

}

function attMatches(a){
  const q = attSearch.toLowerCase();
  if(q && ((a.denomination||'') + ' ' + (a.numero||'') + ' ' + (a.forme||'') + ' ' + (a.intermediaire||'')).toLowerCase().indexOf(q) === -1) return false;
  if(attMonth && (a.date||'').slice(0,7) !== attMonth) return false;
  return true;
}
function sortedAtt(){
  return attestations.slice().sort(function(a,b){
    return (b.date||'').localeCompare(a.date||'') || (b.numero||'').localeCompare(a.numero||'');
  });
}

function attArchiveListHTML(){
  const list = sortedAtt().filter(attMatches);
  if(!list.length) return '<p class="empty">Aucune attestation trouvée.</p>';
  return list.map(function(a){
    return '<div class="archive-item">'
      + '<div class="info"><b>' + esc(a.denomination) + ' ' + esc(a.forme) + '</b>'
      + '<span>N° ' + esc(a.numero) + ' — ' + fmtDate(a.date) + (a.avecCachet ? ' — avec cachet' : '') + '</span></div>'
      + '<div class="row-actions" style="margin-top:0;">'
      + '<button class="btn ghost" data-act="voir" data-id="' + esc(a.numero) + '">Voir</button>'
      + '<button class="btn ghost" data-act="modifier" data-id="' + esc(a.numero) + '">Modifier</button>'
      + '<button class="btn danger" data-act="suppr" data-id="' + esc(a.numero) + '">Supprimer</button>'
      + '</div></div>';
  }).join('');
}

function viewAttArchive(){
  if(!attestations.length) return '<div class="card"><h2>Archive des attestations</h2><p class="empty">Aucune attestation archivée pour l\'instant.</p></div>';
  const viewing = attestations.find(function(a){ return a.numero === viewingAttId; });
  let html = '<div class="card">'
    + '<h2>Archive des attestations</h2>'
    + '<p class="sub">' + attestations.length + ' attestation(s) enregistrée(s)</p>'

      + '<button class="btn secondary" id="a-pdf-archive">Télécharger en PDF</button>'
      + '<button class="btn secondary" id="a-word-archive">Télécharger en Word</button>'

function attSuiviBodyHTML(){
  const list = sortedAtt().filter(attMatches);
  let total = 0, impaye = 0;
  list.forEach(function(a){ const m = Number(a.montant) || 0; total += m; if(!a.paye) impaye += m; });
  const stats = '<div class="stats">'
    + '<div class="stat"><b>' + list.length + '</b><span>attestation(s)' + (attMonth ? ' ce mois' : '') + '</span></div>'
    + '<div class="stat"><b>' + total.toLocaleString('fr-FR') + ' DH</b><span>montant total</span></div>'
    + '<div class="stat"><b>' + list.filter(function(a){ return !a.paye; }).length + '</b><span>non payée(s) — ' + impaye.toLocaleString('fr-FR') + ' DH</span></div>'
    + '</div>';
  if(!list.length) return stats + '<p class="empty">Aucune attestation pour ce filtre.</p>';
  let rows = '';
  list.forEach(function(a){
    rows += '<tr>'
      + '<td>' + fmtDate(a.date) + '</td>'
      + '<td>' + esc(a.denomination) + '</td>'
      + '<td>' + (esc(a.forme)||'—') + '</td>'
      + '<td>' + esc(a.numero) + '</td>'
      + '<td>' + (esc(a.telephone)||'—') + '</td>'
      + '<td>' + (esc(a.intermediaire)||'—') + '</td>'
      + '<td>' + (a.montant ? esc(a.montant) + ' DH' : '—') + '</td>'
      + '<td><button class="pay-toggle ' + (a.paye?'paid':'unpaid') + '" data-act="pay" data-id="' + esc(a.numero) + '">' + (a.paye?'Payé':'Non payé') + '</button></td>'
      + '</tr>';
  });
  return stats + '<div class="table-wrap"><table><thead><tr>'
    + '<th>Date</th><th>Société</th><th>Forme</th><th>N°</th><th>Téléphone</th><th>Intermédiaire</th><th>Montant</th><th>Paiement</th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function viewAttSuivi(){
  if(!attestations.length) return '<div class="card"><h2>Suivi des attestations</h2><p class="empty">Aucune attestation pour l\'instant. Crée-en une depuis "Nouvelle attestation".</p></div>';

    + '<h2>Suivi des attestations</h2>'

    + '<div id="a-suivi-body">' + attSuiviBodyHTML() + '</div>'
    + '</div>';

function startEditAtt(a){
  attEditing = a.numero;
  attDraft = Object.assign({}, a);
  attPreview = null;
  viewingAttId = null;
  activeTab = 'att-nouveau';
  render();
}

function downloadAttJSON(){
  const blob = new Blob([JSON.stringify(attestations, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = 'attestations-domiciliation-' + todayISO() + '.json';
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

function attachAttHandlers(){
  const $ = function(id){ return document.getElementById(id); };

  /* --- Nouveau --- */
  if($('a-cachet-change')) $('a-cachet-change').onclick = function(){ $('a-cachet-upload').style.display = 'block'; };
  if($('a-cachet-delete')) $('a-cachet-delete').onclick = async function(){
    if(!confirm('Supprimer le cachet enregistré ?')) return;
    try{ await deleteDoc(doc(db, 'users', currentUser.uid, 'settings', 'cachet')); }catch(e){ console.error(e); }
    saveAttDraft(); cachet = null; if(attDraft) attDraft.avecCachet = false; render();
  };
  if($('a-cachet-file')) $('a-cachet-file').onchange = async function(){
    const file = this.files && this.files[0];
    if(!file) return;
    const status = $('a-cachet-status');
    status.textContent = 'Traitement du cachet...'; status.className = 'ocr-status busy';
    try{
      const transp = $('a-cachet-transp').checked;
      let c = await processCachet(file, transp, 500);
      if(c.dataUrl.length > 850000) c = await processCachet(file, transp, 320);
      await setDoc(doc(db, 'users', currentUser.uid, 'settings', 'cachet'), c);
      saveAttDraft();
      cachet = c;
      if(attDraft) attDraft.avecCachet = true; else attDraft = { avecCachet: true };
      render();
    }catch(e){
      console.error(e);
      status.textContent = 'Impossible d\'enregistrer le cachet. Vérifie ta connexion et réessaie.';
      status.className = 'ocr-status';
    }
  };
  if($('a-generer')) $('a-generer').onclick = function(){
    const a = readAttForm();
    if(!a.denomination || !a.forme){ alert('Merci de renseigner la dénomination et la forme juridique.'); return; }
    attDraft = a;
    attPreview = a;
    render();
    const card = document.querySelector('.att-frame');
    if(card) card.scrollIntoView({behavior:'smooth', block:'start'});
  };
  if($('a-annuler')) $('a-annuler').onclick = function(){
    attEditing = null; attDraft = null; attPreview = null; render();
  };
  if($('a-enregistrer')) $('a-enregistrer').onclick = async function(){
    const a = attPreview;
    const exists = attestations.some(function(x){ return x.numero === a.numero; });
    if(exists && a.numero !== attEditing){ alert('Ce numéro existe déjà dans l\'archive. Change le numéro.'); return; }
    this.disabled = true;
    const ok = await saveAttestationDoc(a);
    if(ok){
      if(attEditing && attEditing !== a.numero){
        try{ await deleteDoc(doc(db, 'users', currentUser.uid, 'attestations', attEditing)); }catch(e){ console.error(e); }
        attestations = attestations.filter(function(x){ return x.numero !== attEditing; });
      }
      const idx = attestations.findIndex(function(x){ return x.numero === a.numero; });
      if(idx > -1) attestations[idx] = a; else attestations.push(a);
      attPreview = null; attDraft = null; attEditing = null;
      viewingAttId = a.numero;
      activeTab = 'att-archive';
      render();
    } else { this.disabled = false; }
  };
  if($('a-pdf')) $('a-pdf').onclick = function(){ downloadAttPDF(attPreview); };
  if($('a-word')) $('a-word').onclick = function(){ downloadAttDocx(attPreview); };
  if($('a-imprimer')) $('a-imprimer').onclick = function(){ window.print(); };

  /* --- Archive --- */
  const getViewing = function(){ return attestations.find(function(x){ return x.numero === viewingAttId; }); };
  if($('a-pdf-archive')) $('a-pdf-archive').onclick = function(){ const a = getViewing(); if(a) downloadAttPDF(a); };
  if($('a-word-archive')) $('a-word-archive').onclick = function(){ const a = getViewing(); if(a) downloadAttDocx(a); };
  if($('a-imprimer-archive')) $('a-imprimer-archive').onclick = function(){ window.print(); };
  if($('a-fermer-archive')) $('a-fermer-archive').onclick = function(){ viewingAttId = null; render(); };
  if($('a-export')) $('a-export').onclick = downloadAttJSON;

  const list = $('a-archive-list');
  if(list) list.onclick = async function(ev){
    const b = ev.target.closest('button[data-act]');
    if(!b) return;
    const a = attestations.find(function(x){ return x.numero === b.dataset.id; });
    if(!a) return;
    if(b.dataset.act === 'voir'){
      viewingAttId = a.numero; render();
      const v = $('a-viewer'); if(v) v.scrollIntoView({behavior:'smooth', block:'start'});
    }
    if(b.dataset.act === 'modifier') startEditAtt(a);
    if(b.dataset.act === 'suppr'){
      if(!confirm('Supprimer définitivement cette attestation ?')) return;
      try{ await deleteDoc(doc(db, 'users', currentUser.uid, 'attestations', a.numero)); }
      catch(e){ console.error(e); alert('La suppression a échoué. Vérifie ta connexion.'); return; }
      attestations = attestations.filter(function(x){ return x.numero !== a.numero; });
      if(viewingAttId === a.numero) viewingAttId = null;
      render();
    }
  };

  /* --- Recherche / filtre (sans perdre le focus) --- */
  const search = $('a-search');
  if(search) search.oninput = function(){
    attSearch = search.value;
    if($('a-archive-list')) $('a-archive-list').innerHTML = attArchiveListHTML();
    if($('a-suivi-body')) $('a-suivi-body').innerHTML = attSuiviBodyHTML();
  };
  const month = $('a-month');
  if(month) month.onchange = function(){
    attMonth = month.value;
    $('a-suivi-body').innerHTML = attSuiviBodyHTML();
  };

  /* --- Suivi : paiement --- */
  const suivi = $('a-suivi-body');
  if(suivi) suivi.onclick = async function(ev){
    const b = ev.target.closest('button[data-act="pay"]');
    if(!b) return;
    const a = attestations.find(function(x){ return x.numero === b.dataset.id; });
    if(!a) return;
    b.disabled = true;
    try{
      await updateDoc(doc(db, 'users', currentUser.uid, 'attestations', a.numero), { paye: !a.paye });

function nextResNumero(){
  const year = new Date().getFullYear();
  const prefix = 'RS-' + year + '-';
  let max = 0;
  resiliations.forEach(function(r){
    if((r.numero||'').indexOf(prefix) === 0){
      const n = parseInt(r.numero.slice(prefix.length), 10);
      if(!isNaN(n) && n > max) max = n;
    }
  });
  return prefix + String(max + 1).padStart(3,'0');
}
async function loadResiliations(){
  try{
    const snap = await getDocs(collection(db, 'users', currentUser.uid, 'resiliations'));

  }catch(e){ console.error(e); resiliations = []; }
}

function resGerants(r){

function joinNames(list){
  if(list.length <= 1) return list.join('');
  return list.slice(0, -1).join(', ') + ' et ' + list[list.length - 1];
}
function resRepresentation(r){
  const g = resGerants(r);
  const names = g.map(function(x){ return (x.civ || 'Mr') + ' ' + x.nom; });
  if(g.length === 0) return 'représentée par son gérant';
  if(g.length === 1) return 'représentée par ' + (g[0].civ === 'Mme' ? 'sa gérante ' : 'son gérant ') + names[0];
  return 'représentée par ses cogérants ' + joinNames(names);
}

async function downloadResPDF(r){
  if(!window.html2canvas || !window.jspdf){ alert('Le générateur PDF est en train de charger, réessaie dans quelques secondes.'); return; }
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;height:1123px;';
  holder.innerHTML = resiliationPageHTML(r);
  document.body.appendChild(holder);
  try{
    await Promise.all(Array.prototype.map.call(holder.querySelectorAll('img'), function(img){
      return img.complete ? Promise.resolve() : new Promise(function(res){ img.onload = img.onerror = res; });
    }));
    const canvas = await html2canvas(holder.firstElementChild, {scale:2, backgroundColor:'#ffffff', useCORS:true, width:794, height:1123});

  }finally{
    document.body.removeChild(holder);
  }
}

function resMatches(r){

  return true;

  });
  return stats + '<div class="table-wrap"><table><thead><tr>'
    + '<th>Date</th><th>Société</th><th>Forme</th><th>RC</th><th>Gérant(s)</th><th>N°</th><th>Téléphone</th><th>Intermédiaire</th><th>Montant</th><th>Paiement</th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}
function viewResSuivi(){
  if(!resiliations.length) return '<div class="card"><h2>Suivi des résiliations</h2><p class="empty">Aucune résiliation pour l\'instant. Crée-en une depuis "Nouvelle résiliation".</p></div>';
  return '<div class="card">'
    + '<h2>Suivi des résiliations</h2>'
    + '<p class="sub">Filtre par mois ou par société, et coche les paiements reçus.</p>'
    + '<div class="toolbar">'
    + '<div class="field"><label>Mois</label><input type="month" id="r-month" value="' + esc(resMonth) + '"></div>'
    + '<div class="field"><label>Rechercher</label><input id="r-search" placeholder="Société, RC, gérant, numéro..." value="' + esc(resSearch) + '"></div>'
    + '</div>'
    + '<div id="r-suivi-body">' + resSuiviBodyHTML() + '</div>'
    + '</div>';
}
function startEditRes(r){
  resEditing = r.numero;
  resDraft = JSON.parse(JSON.stringify(r));
  resPreview = null;
  viewingResId = null;
  activeTab = 'res-nouveau';
  render();
}
function downloadResJSON(){
  const blob = new Blob([JSON.stringify(resiliations, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = 'resiliations-domiciliation-' + todayISO() + '.json';
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

function attachResHandlers(){
  const $ = function(id){ return document.getElementById(id); };

  /* --- Gérants --- */
  const box = $('r-gerants');
  if(box) box.onclick = function(ev){
    const b = ev.target.closest('.r-del-gerant');
    if(b) b.closest('.gerant-row').remove();
  };
  if($('r-add-gerant')) $('r-add-gerant').onclick = function(){
    box.insertAdjacentHTML('beforeend', gerantRowHTML({civ:'Mr', nom:''}, true));
    const inputs = box.querySelectorAll('input'); inputs[inputs.length - 1].focus();
  };

  /* --- Cachet --- */
  if($('r-cachet-change')) $('r-cachet-change').onclick = function(){ $('r-cachet-upload').style.display = 'block'; };
  if($('r-cachet-file')) $('r-cachet-file').onchange = async function(){
    const file = this.files && this.files[0];
    if(!file) return;
    const status = $('r-cachet-status');
    status.textContent = 'Traitement du cachet...'; status.className = 'ocr-status busy';
    try{
      const transp = $('r-cachet-transp').checked;
      let c = await processCachet(file, transp, 500);
      if(c.dataUrl.length > 850000) c = await processCachet(file, transp, 320);
      await setDoc(doc(db, 'users', currentUser.uid, 'settings', 'cachet'), c);
      saveResDraft();
      cachet = c;
      if(resDraft) resDraft.avecCachet = true; else resDraft = { avecCachet: true };
      render();
    }catch(e){
      console.error(e);
      status.textContent = 'Impossible d\'enregistrer le cachet. Vérifie ta connexion et réessaie.';
      status.className = 'ocr-status';
    }
  };

  /* --- Nouveau --- */
  if($('r-generer')) $('r-generer').onclick = function(){
    const r = readResForm();
    if(!r.denomination || !r.forme){ alert('Merci de renseigner le nom de la société et la forme juridique.'); return; }
    if(!resGerants(r).length){ alert('Merci de renseigner au moins un gérant.'); return; }
    resDraft = r;
    resPreview = r;
    render();
    const card = document.querySelector('.att-frame');
    if(card) card.scrollIntoView({behavior:'smooth', block:'start'});
  };
  if($('r-annuler')) $('r-annuler').onclick = function(){
    resEditing = null; resDraft = null; resPreview = null; render();
  };
  if($('r-enregistrer')) $('r-enregistrer').onclick = async function(){
    const r = resPreview;
    const exists = resiliations.some(function(x){ return x.numero === r.numero; });
    if(exists && r.numero !== resEditing){ alert('Ce numéro existe déjà dans l\'archive. Change le numéro.'); return; }
    this.disabled = true;
    const ok = await saveResiliationDoc(r);
    if(ok){
      if(resEditing && resEditing !== r.numero){
        try{ await deleteDoc(doc(db, 'users', currentUser.uid, 'resiliations', resEditing)); }catch(e){ console.error(e); }
        resiliations = resiliations.filter(function(x){ return x.numero !== resEditing; });
      }
      const idx = resiliations.findIndex(function(x){ return x.numero === r.numero; });
      if(idx > -1) resiliations[idx] = r; else resiliations.push(r);
      resPreview = null; resDraft = null; resEditing = null;
      viewingResId = r.numero;
      activeTab = 'res-archive';
      render();
    } else { this.disabled = false; }
  };
  if($('r-pdf')) $('r-pdf').onclick = function(){ downloadResPDF(resPreview); };
  if($('r-word')) $('r-word').onclick = function(){ downloadResDocx(resPreview); };
  if($('r-imprimer')) $('r-imprimer').onclick = function(){ window.print(); };

  /* --- Archive --- */
  const getViewing = function(){ return resiliations.find(function(x){ return x.numero === viewingResId; }); };
  if($('r-pdf-archive')) $('r-pdf-archive').onclick = function(){ const r = getViewing(); if(r) downloadResPDF(r); };
  if($('r-word-archive')) $('r-word-archive').onclick = function(){ const r = getViewing(); if(r) downloadResDocx(r); };
  if($('r-imprimer-archive')) $('r-imprimer-archive').onclick = function(){ window.print(); };
  if($('r-fermer-archive')) $('r-fermer-archive').onclick = function(){ viewingResId = null; render(); };
  if($('r-export')) $('r-export').onclick = downloadResJSON;

  const list = $('r-archive-list');
  if(list) list.onclick = async function(ev){
    const b = ev.target.closest('button[data-act]');
    if(!b) return;
    const r = resiliations.find(function(x){ return x.numero === b.dataset.id; });
    if(!r) return;
    if(b.dataset.act === 'voir'){
      viewingResId = r.numero; render();
      const v = $('r-viewer'); if(v) v.scrollIntoView({behavior:'smooth', block:'start'});
    }
    if(b.dataset.act === 'modifier') startEditRes(r);
    if(b.dataset.act === 'suppr'){
      if(!confirm('Supprimer définitivement cette résiliation ?')) return;
      try{ await deleteDoc(doc(db, 'users', currentUser.uid, 'resiliations', r.numero)); }
      catch(e){ console.error(e); alert('La suppression a échoué. Vérifie ta connexion.'); return; }
      resiliations = resiliations.filter(function(x){ return x.numero !== r.numero; });
      if(viewingResId === r.numero) viewingResId = null;
      render();
    }
  };

  /* --- Recherche / filtre --- */
  const search = $('r-search');
  if(search) search.oninput = function(){
    resSearch = search.value;
    if($('r-archive-list')) $('r-archive-list').innerHTML = resArchiveListHTML();
    if($('r-suivi-body')) $('r-suivi-body').innerHTML = resSuiviBodyHTML();
  };
  const month = $('r-month');
  if(month) month.onchange = function(){
    resMonth = month.value;
    $('r-suivi-body').innerHTML = resSuiviBodyHTML();
  };

  /* --- Suivi : paiement --- */
  const suivi = $('r-suivi-body');
  if(suivi) suivi.onclick = async function(ev){
    const b = ev.target.closest('button[data-act="pay"]');
    if(!b) return;
    const r = resiliations.find(function(x){ return x.numero === b.dataset.id; });
    if(!r) return;
    b.disabled = true;
    try{
      await updateDoc(doc(db, 'users', currentUser.uid, 'resiliations', r.numero), { paye: !r.paye });
      r.paye = !r.paye;
      suivi.innerHTML = resSuiviBodyHTML();
    }catch(e){ console.error(e); alert('La mise à jour a échoué. Vérifie ta connexion.'); b.disabled = false; }
  };
}

</script>
</body>
</html>
